<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Manager (Mealie Clone)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

<div class="max-w-4xl mx-auto p-4 mt-8">
    <h1 class="text-3xl font-black mb-6 text-center text-orange-600 tracking-tight">Recipe Manager</h1>

    <!-- Navigation -->
    <div class="flex justify-center gap-4 mb-8">
        <button onclick="switchTab('my-recipes')" id="tab-my-recipes" class="px-6 py-2 rounded-full font-bold bg-orange-600 text-white shadow-md transition-colors">My Recipes</button>
        <button onclick="switchTab('discover')" id="tab-discover" class="px-6 py-2 rounded-full font-bold bg-white text-gray-600 shadow-md hover:bg-gray-50 transition-colors">Discover</button>
    </div>

    <!-- My Recipes View -->
    <div id="view-my-recipes">
        <!-- Scraper Form -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-8">
            <h2 class="text-xl font-bold mb-2 text-gray-800">Import Recipe</h2>
            <p class="text-sm text-gray-500 mb-4">Paste a URL from any recipe site (or TikTok/Instagram for AI extraction)</p>
            <div class="flex gap-2">
                <input type="url" id="urlInput" placeholder="https://..." class="flex-1 p-3 border border-gray-200 rounded-lg focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 bg-gray-50">
                <button onclick="scrapeRecipe()" class="bg-orange-600 text-white px-8 py-3 rounded-lg font-bold hover:bg-orange-700 transition-colors shadow-sm">Import</button>
            </div>
            <p id="statusMsg" class="mt-3 text-sm hidden font-medium"></p>
        </div>

        <!-- Recipe List -->
        <div>
            <div class="flex justify-between items-end mb-4">
                <h2 class="text-2xl font-bold text-gray-800">Your Recipes</h2>
            </div>
            <div id="recipeList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <!-- Discover View -->
    <div id="view-discover" class="hidden">
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Suggested Recipes</h2>
        <p class="text-gray-500 mb-6">Popular recipes from around the web with great feedback. Click to import instantly!</p>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="discoverList">
            <!-- JS Injected -->
        </div>
    </div>

    <!-- Single Recipe View -->
    <div id="view-single-recipe" class="hidden bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <button onclick="switchTab('my-recipes')" class="text-orange-600 font-bold mb-4 hover:underline">← Back to Recipes</button>
        <div id="singleRecipeContent">
            <!-- JS Injected -->
        </div>
    </div>
</div>

<script>
    let allRecipes = [];

    const suggestedRecipes = [
        { title: "Best Ever Chocolate Chip Cookies", url: "https://tasty.co/recipe/the-best-chewy-chocolate-chip-cookies", image: "https://img.buzzfeed.com/thumbnailer-prod-us-east-1/video-api/assets/62298.jpg", time: "45m" },
        { title: "Classic Beef Stroganoff", url: "https://www.recipetineats.com/beef-stroganoff/", image: "https://www.recipetineats.com/wp-content/uploads/2018/01/Beef-Stroganoff_2-1-1.jpg", time: "30m" },
        { title: "Creamy Tuscan Chicken", url: "https://therecipecritic.com/creamy-tuscan-garlic-chicken/", image: "https://therecipecritic.com/wp-content/uploads/2017/09/Creamy-Tuscan-Garlic-Chicken.jpg", time: "25m" },
        { title: "Crispy Smashed Potatoes", url: "https://cookieandkate.com/crispy-smashed-potatoes-recipe/", image: "https://cookieandkate.com/images/2019/12/crispy-smashed-potatoes-recipe-1.jpg", time: "55m" },
        { title: "Honey Garlic Glazed Salmon", url: "https://cafedelites.com/honey-garlic-salmon/", image: "https://cafedelites.com/wp-content/uploads/2018/03/Honey-Garlic-Salmon-2020.jpg", time: "20m" }
    ];

    function switchTab(tabId) {
        document.getElementById('view-my-recipes').classList.toggle('hidden', tabId !== 'my-recipes');
        document.getElementById('view-discover').classList.toggle('hidden', tabId !== 'discover');
        document.getElementById('view-single-recipe').classList.toggle('hidden', tabId !== 'single-recipe');
        
        document.getElementById('tab-my-recipes').className = tabId === 'my-recipes' 
            ? 'px-6 py-2 rounded-full font-bold bg-orange-600 text-white shadow-md transition-colors'
            : 'px-6 py-2 rounded-full font-bold bg-white text-gray-600 shadow-md hover:bg-gray-50 transition-colors';
            
        document.getElementById('tab-discover').className = tabId === 'discover' 
            ? 'px-6 py-2 rounded-full font-bold bg-orange-600 text-white shadow-md transition-colors'
            : 'px-6 py-2 rounded-full font-bold bg-white text-gray-600 shadow-md hover:bg-gray-50 transition-colors';
    }

    function renderDiscover() {
        const list = document.getElementById('discoverList');
        list.innerHTML = suggestedRecipes.map(r => `
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col group hover:shadow-md transition-shadow">
                <div class="relative h-48 overflow-hidden">
                    <img src="/api/proxy-image?url=${encodeURIComponent(r.image)}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    <div class="absolute top-2 right-2 bg-black/60 text-white text-[10px] font-bold px-2 py-1 rounded-full backdrop-blur-sm">⭐ Popular</div>
                </div>
                <div class="p-4 flex-1 flex flex-col">
                    <h3 class="font-bold text-gray-800 leading-tight mb-2">${r.title}</h3>
                    <div class="text-xs text-gray-500 font-medium mb-4">⏱️ ${r.time}</div>
                    <button onclick="importSuggested('${r.url}')" class="mt-auto w-full bg-orange-50 text-orange-600 py-2 rounded-lg font-bold text-sm hover:bg-orange-100 transition-colors">Import Recipe</button>
                </div>
            </div>
        `).join('');
    }

    async function importSuggested(url) {
        switchTab('my-recipes');
        document.getElementById('urlInput').value = url;
        scrapeRecipe();
    }
    async function loadRecipes() {
        try {
            const res = await fetch('/api/recipes');
            allRecipes = await res.json();
            const list = document.getElementById('recipeList');
            list.innerHTML = '';
            
            allRecipes.forEach(r => {
                const imgSource = r.image_url ? (r.image_url.startsWith('http') ? `/api/proxy-image?url=${encodeURIComponent(r.image_url)}` : r.image_url) : '';
                list.innerHTML += `
                    <div onclick="viewRecipe(${r.id})" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col cursor-pointer hover:shadow-md transition-shadow group">
                        ${imgSource ? `<img src="${imgSource}" class="h-48 w-full object-cover group-hover:scale-105 transition-transform duration-500">` : '<div class="h-48 bg-gray-100 flex items-center justify-center text-gray-400">No Image</div>'}
                        <div class="p-5 flex-1 flex flex-col">
                            <h3 class="font-bold text-gray-800 text-lg mb-2 leading-tight">${r.title}</h3>
                            <p class="text-sm text-gray-500 mb-4 line-clamp-2">${r.description || ''}</p>
                            <div class="mt-auto flex justify-between text-xs font-semibold text-gray-500">
                                <span class="bg-gray-100 px-2 py-1 rounded">⏱️ ${r.prep_time || '?'} prep</span>
                                <span class="bg-gray-100 px-2 py-1 rounded">🍽️ ${r.servings || '?'} servings</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        } catch(e) {
            console.error('Failed to load recipes');
        }
    }

    function viewRecipe(id) {
        const recipe = allRecipes.find(r => r.id === id);
        if(!recipe) return;
        
        switchTab('single-recipe');
        
        const imgSource = recipe.image_url ? (recipe.image_url.startsWith('http') ? `/api/proxy-image?url=${encodeURIComponent(recipe.image_url)}` : recipe.image_url) : '';
        const ingHtml = (recipe.ingredients || []).map(i => `<li class="flex gap-2 items-start text-gray-700 py-1 border-b border-gray-100"><span class="text-orange-500">•</span> <span>${i}</span></li>`).join('');
        const instHtml = (recipe.instructions || []).map((step, idx) => `<div class="flex gap-4 mb-4"><div class="w-8 h-8 shrink-0 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center font-bold">${idx+1}</div><p class="text-gray-700 pt-1">${step}</p></div>`).join('');
        
        document.getElementById('singleRecipeContent').innerHTML = `
            <div class="flex flex-col md:flex-row gap-8 mb-8">
                ${imgSource ? `<img src="${imgSource}" class="w-full md:w-1/2 rounded-xl object-cover max-h-80 shadow-md">` : ''}
                <div class="flex-1">
                    <h2 class="text-3xl font-black text-gray-800 mb-4">${recipe.title}</h2>
                    <p class="text-gray-600 mb-6">${recipe.description || ''}</p>
                    <div class="flex gap-4 text-sm font-bold text-gray-700 mb-6 bg-gray-50 p-4 rounded-lg">
                        <div>⏱️ Prep: <span class="text-orange-600">${recipe.prep_time || 'N/A'}</span></div>
                        <div>⏱️ Cook: <span class="text-orange-600">${recipe.cook_time || 'N/A'}</span></div>
                        <div>🍽️ Yield: <span class="text-orange-600">${recipe.servings || 'N/A'}</span></div>
                    </div>
                    <a href="${recipe.original_url}" target="_blank" class="text-orange-600 text-sm font-bold hover:underline">🔗 View Original Source</a>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="md:col-span-1 bg-orange-50/50 p-6 rounded-xl">
                    <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">🥕 Ingredients</h3>
                    <ul class="space-y-1">
                        ${ingHtml}
                    </ul>
                </div>
                <div class="md:col-span-2 bg-white p-6 rounded-xl border border-gray-100">
                    <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">👨‍🍳 Instructions</h3>
                    <div>
                        ${instHtml}
                    </div>
                </div>
            </div>
        `;
    }

    async function scrapeRecipe() {
        const url = document.getElementById('urlInput').value;
        const status = document.getElementById('statusMsg');
        
        if(!url) return;
        
        status.textContent = "Scraping... Please wait.";
        status.className = "mt-2 text-sm text-blue-600 block";
        
        try {
            const res = await fetch('/api/recipes/scrape', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });
            const data = await res.json();
            
            if(data.error) throw new Error(data.error);
            
            status.textContent = "Success! Recipe imported.";
            status.className = "mt-2 text-sm text-green-600 block";
            document.getElementById('urlInput').value = '';
            loadRecipes();
            
        } catch(e) {
            status.textContent = "Error: " + e.message;
            status.className = "mt-2 text-sm text-red-600 block";
        }
    }

    // Init
    loadRecipes();
    renderDiscover();
</script>

</body>
</html>
